<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZenMonitor v5</title>
<style>
:root{--bg:#0b0f14;--bg2:#10161e;--card:#141c26;--card2:#18222e;--line:#223042;--line2:#2c3d52;
--tx:#e6edf3;--tx2:#9fb0c2;--mute:#6b7d90;--acc:#3b9eff;--acc2:#1f6fd1;--ok:#2fd27a;--warn:#f5b73b;--bad:#f2546a;--info:#8f7bff;
--r:10px;--mono:ui-monospace,"Cascadia Mono",Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
body{display:grid;grid-template-columns:220px 1fr;grid-template-rows:56px 1fr;height:100vh;overflow:hidden}
header{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--bg2)}
.brand{font-weight:700;font-size:16px;letter-spacing:.04em}.brand span{color:var(--acc)}
.conn{display:flex;align-items:center;gap:6px;color:var(--tx2);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block;flex:none}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.info{background:var(--acc)}.dot.mute{background:var(--mute)}
.hgrow{flex:1}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:6px 10px}
button{cursor:pointer;transition:.15s}button:hover{border-color:var(--acc);background:var(--card2)}
button.pri{background:var(--acc2);border-color:var(--acc)}button.pri:hover{background:var(--acc)}
button.dang{border-color:#6a2a35}button.dang:hover{background:#3a1720;border-color:var(--bad)}
button.sm{padding:3px 8px;font-size:12px;border-radius:6px}
nav{border-right:1px solid var(--line);background:var(--bg2);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--tx2);text-decoration:none;cursor:pointer}
nav a:hover{background:var(--card);color:var(--tx)}nav a.on{background:var(--card2);color:var(--tx);box-shadow:inset 3px 0 0 var(--acc)}
nav .ic{width:18px;text-align:center}nav .sep{height:1px;background:var(--line);margin:8px 6px}
nav .foot{margin-top:auto;font-size:11px;color:var(--mute);padding:8px 12px}
main{overflow:auto;padding:20px 24px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:14px;margin:22px 0 10px;color:var(--tx2);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--mute);font-size:13px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{color:var(--mute);font-size:12px}.kpi .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}.kpi .s{font-size:12px;color:var(--tx2);margin-top:2px}
.pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pc>.h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card2)}
.pc>.h b{flex:1}.tag{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--bg2);border:1px solid var(--line2);color:var(--tx2)}
.tag.t{border-color:var(--info);color:var(--info)}
.ch{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.ch:last-child{border-bottom:0}.ch:hover{background:var(--card2)}
.ch .n{font-weight:600}.ch .z{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.ch .m{grid-column:2/4;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{grid-column:1/4;height:4px;background:var(--bg2);border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--acc)}.bar i.w{background:var(--warn)}
.st{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.st.ok{background:#11331f;color:var(--ok)}.st.warn{background:#3a2b0c;color:var(--warn)}.st.bad{background:#3a1720;color:var(--bad)}.st.info{background:#142a44;color:var(--acc)}.st.mute{background:var(--bg2);color:var(--mute)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mute);font-weight:600;font-size:12px;background:var(--card2);cursor:pointer;user-select:none}
tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--card2)}td.num{font-family:var(--mono);text-align:right}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.drawer{position:fixed;top:0;right:0;width:440px;max-width:100%;height:100%;background:var(--bg2);border-left:1px solid var(--line2);box-shadow:-10px 0 30px #0008;transform:translateX(100%);transition:.2s;z-index:20;display:flex;flex-direction:column}
.drawer.open{transform:none}.drawer .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.drawer .dh b{flex:1;font-size:16px}
.drawer .db{padding:16px 18px;overflow:auto;flex:1}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:13px}.kv span:nth-child(odd){color:var(--mute)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.sw{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.tg{width:38px;height:22px;border-radius:20px;background:var(--line2);position:relative;cursor:pointer;flex:none;border:0;padding:0}
.tg::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s}.tg.on{background:var(--acc)}.tg.on::after{left:19px}
.shot{width:100%;border-radius:8px;border:1px solid var(--line);margin-top:10px;background:#000;min-height:40px}
.toast{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:30}
.toast div{background:var(--card2);border:1px solid var(--line2);border-left:3px solid var(--acc);padding:10px 14px;border-radius:8px;max-width:420px;box-shadow:0 6px 20px #0008}
.toast .e{border-left-color:var(--bad)}
.feed{display:flex;flex-direction:column;gap:6px}.feed div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;display:flex;gap:10px}
.feed .t{color:var(--mute);font-family:var(--mono);flex:none}.feed .bad{border-left:3px solid var(--bad)}.feed .ok{border-left:3px solid var(--ok)}
.mapbox{display:grid;grid-template-columns:1fr 300px;gap:14px}.mapsv{display:flex;flex-wrap:wrap;align-items:flex-start}
.mapsv>canvas{flex:1 1 420px;width:auto!important;max-width:calc(100vh - 150px);min-width:0}
.mapsv>div{flex:1 1 300px;min-width:240px}
.mapbox canvas{width:100%;height:auto;aspect-ratio:1;background:#000;border:1px solid var(--line);border-radius:var(--r);image-rendering:pixelated}
.note{color:var(--mute);font-size:13px}
.dgrid{display:grid;grid-template-columns:1fr 400px;gap:16px;align-items:start}@media(max-width:1300px){.dgrid{grid-template-columns:1fr}}
.ch{position:relative}.qa{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:none;gap:4px;background:var(--card2);padding:4px;border-radius:8px;border:1px solid var(--line2);box-shadow:0 4px 14px #0008;z-index:2}.ch:hover .qa{display:flex}
.qa button{padding:2px 7px;font-size:13px;border-radius:6px;background:var(--bg2)}

.logbox{background:#06090d;border:1px solid var(--line);border-radius:var(--r);font:12px/1.45 var(--mono);color:#b9c7d6;height:340px;overflow:auto;padding:10px;white-space:pre-wrap;word-break:break-word}
.logbox .w{color:var(--warn)}.logbox .e{color:var(--bad)}
.side{display:flex;flex-direction:column;gap:14px}.side h2{margin:0 0 8px}
.mrow td{background:var(--bg2)}.mrow .inl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 0}
.mrow input[type=number]{width:70px}.err{color:var(--bad)}
.empty{padding:30px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line2);border-radius:var(--r)}
.pcbtn{font-size:11px;padding:1px 7px;margin-left:6px;border-radius:9px;border:1px solid;cursor:pointer;vertical-align:middle}
.pcbtn.on{background:#123a24;color:#7be0a6;border-color:#2b7a4f}
.pcbtn.off{background:#4a1520;color:#ffb3bf;border-color:#a0384b}
</style>
</head>
<body>
<header>
  <div class="brand">Zen<span>Monitor</span> <span style="color:var(--mute);font-weight:400;font-size:12px">v5</span></div>
  <div class="conn"><i class="dot" id="live"></i><span id="livet">conectando…</span></div>
  <div class="hgrow"></div>
  <input id="tok" type="password" placeholder="token de admin" style="width:200px" title="Necessário para comandos. Fica só nesta aba do navegador.">
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div class="drawer" id="drawer"><div class="dh"><b id="dtitle"></b><button class="sm" onclick="closeDrawer()">Fechar ✕</button></div><div class="db" id="dbody"></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
// ---------------------------------------------------------------- estado
let S = null, tab = "dash", drawerChar = null, lastMsgAt = 0, lastRenderError = "", sortKey = "machine", sortDir = 1, filter = "";
const TABS = [
  ["dash", "◉", "Dashboard"], ["chars", "☰", "Personagens"], ["maps", "⌖", "Mapas"],
  ["remote", "▣", "Controle remoto"], ["alerts", "⚑", "Alertas"], ["pcs", "▤", "Computadores"], ["cfg", "⚙", "Configurações"],
];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => n == null ? "—" : Number(n).toLocaleString("pt-BR");
const fmtB = n => n == null ? "—" : n >= 1e9 ? (n / 1e9).toFixed(2).replace(".", ",") + " B" : n >= 1e6 ? (n / 1e6).toFixed(1).replace(".", ",") + " M" : fmt(n);
const fmtDur = s => s == null ? "—" : s < 60 ? s + " s" : s < 3600 ? Math.floor(s / 60) + " min" : Math.floor(s / 3600) + " h " + Math.floor(s % 3600 / 60) + " min";
const hhmm = t => t ? new Date(t * 1000).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "—";
function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k) || ""; sessionStorage.setItem(k, v); } catch { return ""; } }
$("tok").value = ss("zm_admin"); $("tok").onchange = e => ss("zm_admin", e.target.value.trim());

function toast(msg, bad) {
  const d = document.createElement("div"); if (bad) d.className = "e"; d.textContent = msg; $("toast").append(d);
  setTimeout(() => d.remove(), bad ? 9000 : 5000);
}
const PENDING = {};
const SEEN_HOTKEYS = new Set();
let hotkeysInitialized = false, lastCatalogSignature = null, catalogRefreshPending = false;
function checkPending() {
  let hotkeyReceived = false;
  for (const r of (S && S.results) || []) {
    const k = (r.machine || "") + "#" + r.id, p = PENDING[k];
    if (p) {
      delete PENDING[k];
      if (r.message !== "logs") toast(`${p.label} (${r.machine}): ${r.ok === false ? "NÃO FEITO — " : ""}${r.message}`, r.ok === false);
    }
    if (r.id === 0 && /^(?:F[12]\b|atalho ignorado:)/i.test(r.message || "")) {
      const key = r.event_key || JSON.stringify([r.machine, r.ts, r.message, r.ok]);
      if (!SEEN_HOTKEYS.has(key)) {
        SEEN_HOTKEYS.add(key);
        if (hotkeysInitialized) {
          toast(`${r.machine}: ${r.ok === false ? "NÃO FEITO — " : ""}${r.message}`, r.ok === false);
          hotkeyReceived = true;
        }
      }
    }
  }
  hotkeysInitialized = true;
  while (SEEN_HOTKEYS.size > 512) SEEN_HOTKEYS.delete(SEEN_HOTKEYS.values().next().value);
  for (const k in PENDING) if (Date.now() - PENDING[k].t > 60000) { toast(`${PENDING[k].label}: o agente não respondeu em 1 min`, true); delete PENDING[k]; }
  return hotkeyReceived;
}
function receiveState(next) {
  const signature = JSON.stringify([next.catalog, next.spot_catalog, next.spot_directory?.catalog, next.spot_directory?.sources, next.spot_directory?.members]);
  if (lastCatalogSignature !== null && signature !== lastCatalogSignature) catalogRefreshPending = true;
  lastCatalogSignature = signature;
  S = next; lastMsgAt = Date.now();
  const hotkeyReceived = checkPending();
  if (render(catalogRefreshPending || hotkeyReceived, true)) lastRenderError = "";
}
async function cmd(machine, command, label) {
  const token = ss("zm_admin");
  if (!token) { toast("Cole o token de admin (central.toml) no campo do topo.", true); return; }
  try {
    const r = await fetch("/api/command", { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + token }, body: JSON.stringify({ machine, command }) });
    if (!r.ok) { toast(`Falhou (${r.status}): ` + await r.text(), true); return; }
    toast((label || command.cmd) + ": enviado para " + machine);
    // 11/11: a resposta do agente (ex.: "automação desligada neste PC") só aparecia no histórico.
    try { const j = await r.clone().json(); if (j && j.id != null) PENDING[machine + "#" + j.id] = { label: label || command.cmd, t: Date.now() }; } catch {}
  } catch (e) { toast("Erro de rede: " + e, true); }
}

// ---------------------------------------------------------------- classificação
const BUSY = /andando|Lugard|baú|Fortuna:|K:|J:|teleport|recuperando|sacando|devolvendo/;
// v4: o agente novo manda o nome do mapa (c.map); os antigos só mandam posição no mapa do spot.
function mapOf(c) { if (c.map) return c.map; if (c.pos == null && c.map === null) return "?"; return c.spot_map || (/na Arena/.test(c.auto_status || "") ? "Arena" : "Kanturu"); }
const WORLD_OF = { Kanturu: 38, Lorencia: 1, Arena: 7, "Lost Tower": 5, Dungeon: 2, Devias: 3, Noria: 4, Atlans: 8, Tarkan: 9, Icarus: 11, "Valley of Loren": 31, Aida: 34, "Crywolf Fortress": 35 };
// A mesma política de posse e raio usada pelo agente, sem inferir vagas fora da leitura.
const spotNear = (a,b,r=2) => a && b && a.world === b.world && Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y)) <= r;
function groupNames() { return new Set([...(S.spot_directory?.members||[]),...(S.chars||[])].map(c=>c.name.toLowerCase())); }
function catalogFor(w) {
  const d=S.spot_directory;
  return d ? (d.catalog||[]).filter(e=>e.spot.world===w).map(e=>({ ...e.spot,n:e.priority+1,machine:Object.entries(d.sources||{}).find(([,v])=>v.some(c=>spotNear(c.spot,e.spot,0)))?.[0]||'' })).sort((a,b)=>a.n-b.n||a.x-b.x||a.y-b.y) : (S.catalog||[]).filter(p=>(p.world||38)===w).map(p=>({...p,world:w}));
}
// Última leitura de cada spot (ocupação vista por algum char nosso a até 12 tiles). Fica só
// na memória do painel: informação antiga nunca vale como confirmação em tempo real.
const SPOT_SEEN = {};
function spotState(sp) {
  const d=S.spot_directory, chars=S.chars||[], now=S.now||Math.floor(Date.now()/1000), names=groupNames();
  const members=(d?.members||[]).filter(m=>[m.home,m.active].some(p=>spotNear(p,sp)));
  const leases=(d?.leases||[]).filter(l=>l.until>now && spotNear(l.spot,sp));
  const legacy=chars.filter(c=>c.spot&&spotNear({world:WORLD_OF[c.spot_map||'Kanturu'],x:c.spot[0],y:c.spot[1]},sp));
  const owners=[...new Map([...members,...leases,...legacy].map(m=>[m.machine+'|'+m.name,m])).values()];
  const observers=chars.filter(c=>!c.alerts?.some(a=>a==='Offline'||a==='Dc') && WORLD_OF[mapOf(c)]===sp.world && c.pos && Math.max(Math.abs(c.pos[0]-sp.x),Math.abs(c.pos[1]-sp.y))<=12 && Array.isArray(c.nearby));
  const foreign=[...new Set(observers.flatMap(c=>c.nearby.filter(o=>o.kind==='player'&&!names.has(o.name.toLowerCase())&&Math.max(Math.abs(o.x-sp.x),Math.abs(o.y-sp.y))<=12).map(o=>o.name)))];
  const key=sp.world+':'+sp.x+':'+sp.y;
  if(observers.length)SPOT_SEEN[key]={at:now,foreign,by:observers.map(c=>c.name)};
  const last=SPOT_SEEN[key], age=last?now-last.at:null;
  const seen=age==null?'nunca verificado nesta sessão do painel':age<5?'verificado agora':'verificado há '+fmtDur(age)+(last.foreign.length?' (ocupado por '+last.foreign.join(', ')+')':' (livre)');
  if(owners.length)return {kind:'info',label:'Nosso · reservado',color:'#3b9eff',owners,foreign,seen};
  if(foreign.length)return {kind:'bad',label:'Jogador de fora',color:'#f2546a',owners,foreign,seen};
  return {kind:observers.length?'ok':'mute',label:observers.length?'Livre (observado agora)':'Desconhecido (sem leitura agora)',color:observers.length?'#2fd27a':'#6b7d90',owners,foreign,seen};
}
function spotSituation(c) {
  const raw=c.auto_status||'', ks=raw.match(/KS(?: possível)?[\s\S]*?(?:permaneço no spot|$)/)?.[0];
  const home=c.home_spot || (S.spot_directory?.members||[]).find(m=>m.machine===c.machine&&m.name===c.name)?.home;
  const temporary=home && c.spot && WORLD_OF[c.spot_map]!==home.world;
  const notes=[];
  if(ks)notes.push({kind:/queda de/.test(ks)?'warn':'info',text:ks});
  if(temporary){
    const remaining=c.primary_retry_at==null?null:Math.max(0,c.primary_retry_at-(S.now||Math.floor(Date.now()/1000)));
    notes.push({kind:'info',text:'Mapa secundário temporário · principal '+mapName(home.world)+' ('+home.x+', '+home.y+') · '+(remaining==null?'horário de reavaliação ainda não informado':remaining===0?'nova busca no principal pendente':'nova busca em '+fmtDur(remaining))});
  }
  if(/buscando spot/.test(raw))notes.push({kind:'info',text:'Buscando vaga no catálogo · '+raw.split(' · KS')[0]});
  else if(/retorno após morte\/PK:/.test(raw))notes.push({kind:'info',text:'Retorno após morte/PK em andamento · '+raw});
  else if(/morreu|morte|PK/.test(raw))notes.push({kind:'info',text:'Após morte/PK · '+raw});
  return notes;
}
function situationHtml(c) {return spotSituation(c).map(n=>'<span class="note" style="display:block;max-width:480px;white-space:normal;margin-top:4px;color:var(--'+n.kind+')">'+esc(n.text)+'</span>').join('');}

function dist(c) { return c.pos && c.spot ? Math.max(Math.abs(c.pos[0] - c.spot[0]), Math.abs(c.pos[1] - c.spot[1])) : null; }
function status(c) {
  const a = c.alerts || [], st = c.auto_status || "";
  if (a.includes("Offline")) return ["bad", "Sem sinal"];
  if (a.includes("Dc")) return ["bad", "Desconectado"];
  if (a.includes("Dead")) return ["bad", "Morto"];
  if (/retorno após morte\/PK:/.test(st)) return ["info", "Voltando após morte/PK"];
  if (/buscando spot/.test(st)) return ["info", "Buscando vaga"];
  if (BUSY.test(st)) return ["info", /Fortuna|Lugard|K:|J:|baú|sacando/.test(st) ? "Fortuna" : "Voltando"];
  if (spotSituation(c).some(n=>n.text.startsWith('Mapa secundário'))) return ["info", "Mapa temporário"];
  if (/KS(?: possível)?[ (]/.test(st)) return ["warn", "KS · mantém spot"];
  if (a.includes("Limit2B")) return ["warn", "Zen no limite"];
  if (a.includes("Stopped")) return ["warn", "Parado"];
  const d = dist(c);
  if (c.spot && !c.pos) return ["warn", "Fora do mapa"];
  if (d != null && d > 6) return ["warn", "Fora do spot"];
  if (c.automation === false) return ["mute", "Só monitorado"];
  return ["ok", "Farmando"];
}
const stTag = c => { const [k, l] = status(c); return `<span class="st ${k}">${l}</span>`; };
function lastStatusText(c) { return (c.auto_status || "").replace(/^spot do .*?\(\d+, \d+\)\s*·?\s*/, ""); }

// ---------------------------------------------------------------- navegação
let renderedNavTab = null;
function renderNav() {
  if (renderedNavTab === tab) return;
  renderedNavTab = tab;
  $("nav").innerHTML = TABS.map(([k, ic, l], i) => (i === 3 ? '<div class="sep"></div>' : "") + `<a class="${tab === k ? "on" : ""}" data-t="${k}"><span class="ic">${ic}</span>${l}</a>`).join("")
    + `<div class="foot" id="navfoot"></div>`;
  $("nav").querySelectorAll("a").forEach(a => a.onclick = () => { tab = a.dataset.t; location.hash = tab; render(); });
}
const VIEWS = {};
let busyUntil = 0;
document.addEventListener("pointerdown", e => { if (e.target.closest("main select, main input, .drawer")) busyUntil = Date.now() + 4000; else if (e.target.closest("main button")) busyUntil = Date.now() + 1500; }, true);
// ---------------------------------------------------------------- atualização incremental (v5)
// Aplica o HTML novo sobre o DOM existente mudando só o que mudou: o nó sob o mouse, o foco,
// a rolagem e a imagem carregada continuam os mesmos. Antes (v4) a tela inteira era refeita a
// cada estado, e por isso as atualizações paravam com o mouse em cima de um botão.
const MORPH = !/[?&]morph=0/.test(location.search); // ?morph=0 volta ao redesenho completo da v4
function morph(root, html) {
  if (!MORPH) { root.innerHTML = html; return; }
  const tpl = document.createElement("template");
  tpl.innerHTML = html;
  morphChildren(root, tpl.content);
}
function morphChildren(a, b) {
  const an = [...a.childNodes], bn = [...b.childNodes];
  for (let i = 0; i < bn.length; i++) {
    const x = an[i], y = bn[i];
    if (!x) { a.appendChild(y.cloneNode(true)); continue; }
    if (x.nodeType !== y.nodeType || x.nodeName !== y.nodeName || (x.id || "") !== (y.id || "")) { a.replaceChild(y.cloneNode(true), x); continue; }
    if (x.nodeType === 3 || x.nodeType === 8) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; continue; }
    if (x.nodeType !== 1) continue;
    morphAttrs(x, y);
    if (x.nodeName === "TEXTAREA") { if (x !== document.activeElement && x.value !== y.value) x.value = y.value; continue; }
    morphChildren(x, y);
  }
  for (let i = an.length - 1; i >= bn.length; i--) if (an[i].parentNode === a) a.removeChild(an[i]);
}
function morphAttrs(x, y) {
  for (const at of [...x.attributes]) if (!y.hasAttribute(at.name)) x.removeAttribute(at.name);
  for (const at of [...y.attributes]) if (x.getAttribute(at.name) !== at.value) x.setAttribute(at.name, at.value);
  if (x === document.activeElement) return; // nunca mexe no que a pessoa está editando
  if (x.nodeName === "INPUT") {
    if (x.type === "checkbox" || x.type === "radio") x.checked = y.hasAttribute("checked");
    else if (x.value !== (y.getAttribute("value") ?? "")) x.value = y.getAttribute("value") ?? "";
  } else if (x.nodeName === "OPTION") x.selected = y.hasAttribute("selected");
}
function render(force, fromState = false) {
  if (!S) return false;
  const foot = $("navfoot");
  if (foot) foot.textContent = `Estável: +${S.update?.seq ?? "?"}` + (S.update_test ? ` · teste: +${S.update_test.seq}` : "");
  const firstPaint = !$("main").innerHTML.trim();
  force = force || catalogRefreshPending;
  // Uma atualização de catálogo não deve apagar uma edição ainda em foco.
  if (!firstPaint && fromState && document.hasFocus() && document.activeElement?.matches("input, select, textarea, [contenteditable=true]") && document.activeElement.closest("main, .drawer")) return false;
  if (!firstPaint && (fromState || !force) && Date.now() < busyUntil) return false;
  // v5: com a atualização incremental o nó sob o mouse não é recriado; só segura enquanto um
  // botão está pressionado (o clique é concluído no mesmo nó).
  if (!firstPaint && fromState && document.querySelector("main button:active")) return false;
  renderNav();
  const y = $("main").scrollTop;
  const scrolls = ["map-side", "logbox"].map(id=>[id,$(id)?.scrollTop]);
  if (firstPaint || force) $("main").innerHTML = VIEWS[tab](); else morph($("main"), VIEWS[tab]());
  $("main").scrollTop = y;
  (VIEWS[tab + "_after"] || (() => {}))();
  for (const [id,top] of scrolls) if(top!=null && $(id)) $(id).scrollTop=top;
  if (drawerChar && !(fromState && document.querySelector(".drawer:hover"))) renderDrawer();
  catalogRefreshPending = false;
  return true;
}

// ---------------------------------------------------------------- ações rápidas
// Acesso rápido (análise de 10/11): as ações do dia a dia ficam na linha do char; as raras ou
// perigosas (baú inteiro, reler memória, chaves) ficam na ficha (⋯).
function act(m, n, a) {
  const L = { return_to_spot: "Voltar ao spot", fortune: "Fortuna agora", fortune_bank: "Guardar K → J", fortune_all: "Fortuna: baú inteiro" };
  if (a === "fortune_all" && !confirm(`Converter TODO o Zen do baú de ${n} em Fortuna? (a aba 1 guarda 1B; demora ~1 min por bilhão)`)) return;
  cmd(m, { cmd: "run_action", char_name: n, action: a }, `${L[a] || a} (${n})`);
}
function saveSpot(m, n) { cmd(m, { cmd: "save_spot", char_name: n }, `Salvar spot (${n})`); }
function qa(c) {
  const m = esc(c.machine).replace(/'/g, "\\'"), n = esc(c.name).replace(/'/g, "\\'");
  const b = (ic, tip, js) => `<button title="${tip}" onclick="event.stopPropagation();${js}">${ic}</button>`;
  return `<span class="qa">${b("↩", "Voltar ao spot", `act('${m}','${n}','return_to_spot')`)}${b("✦", "Fortuna agora", `act('${m}','${n}','fortune')`)}${b("⇄", "Guardar Fortunas do K no J (aqui, sem ir à cidade)", `act('${m}','${n}','fortune_bank')`)}${b("📍", "Salvar e fixar retorno aqui (F1)", `saveSpot('${m}','${n}')`)}${b("📷", "Ver tela", `openDrawer('${m}|${n}');shot('${m}','${n}')`)}${b("⋯", "Mais ações e ajustes", `openDrawer('${m}|${n}')`)}</span>`;
}

// ---------------------------------------------------------------- Dashboard
let logMachine = "", logAll = false, logText = "", logAt = 0, logErr = "";
async function loadLogs(force) {
  const token = ss("zm_admin");
  if (!logMachine && S) logMachine = (S.machines || [])[0]?.name || "";
  if (!token) { logErr = "Cole o token de admin no topo para ver os logs."; return; }
  if (!force && Date.now() - logAt < 30000) return;
  logAt = Date.now();
  try {
    const r = await fetch(`/api/logs/${encodeURIComponent(logMachine)}${logAll ? "?todas=1" : ""}`, { headers: { authorization: "Bearer " + token } });
    logText = r.ok ? await r.text() : ""; logErr = r.ok ? "" : `(${r.status}) ` + await r.text();
  } catch (e) { logErr = "erro de rede: " + e; }
  const box = $("logbox"); if (box) { const y=box.scrollTop, tail=box.scrollHeight-box.clientHeight-y<24; box.innerHTML = logHtml(); box.scrollTop = tail ? box.scrollHeight : y; }
}
function logHtml() {
  if (logErr) return `<span class="e">${esc(logErr)}</span>`;
  if (!logText) return "carregando…";
  return logText.split("\n").map(l => {
    const m = l.match(/^(\d{4}-\d\d-\d\dT)(\d\d:\d\d:\d\d)[^ ]* +(\w+) +[\w:]+: (.*)$/);
    if (!m) return esc(l);
    const d = new Date(m[1] + m[2] + "Z"), t = isNaN(d) ? m[2] : d.toLocaleTimeString("pt-BR");
    return `<span class="${m[3] === "ERROR" ? "e" : m[3] === "WARN" ? "w" : ""}">${t}</span> ${esc(m[4])}`;
  }).join("\n");
}
setInterval(() => { if (tab === "dash") loadLogs(); }, 5000);

  const m = ((S && S.machines) || []).find(m => m.name === machine);
  if (!m) return "";

  const act = on ? `if(confirm('Parar a automação de ${M}? Os chars ficam onde estão até você religar.'))cmd('${M}',{cmd:'set_config',automation_enabled:false},'automação de ${M} PARADA')`
                 : `cmd('${M}',{cmd:'set_config',automation_enabled:true},'automação de ${M} LIGADA: conferindo e voltando ao spot')`;
  return `<button class="pcbtn ${on ? "on" : "off"}" title="${on ? "Automação ligada neste PC. Clique para PARAR (para mexer no computador)" : "Automação PARADA neste PC. Clique para ligar e devolver os chars ao spot"}" onclick="event.stopPropagation();${act}">${on ? "● auto" : "■ parado"}</button>`;

// ---------------------------------------------------------------- Navegação e Farm (18/11)
// Mapa ORIGINAL = mapa do F1 (só muda por "Salvar e fixar retorno"). Mapas alternativos em
// ordem de prioridade; o agente usa a ordem, o intervalo e as chaves daqui (comando set_farm).
let farmEdit = {};
const FARM_MAPS = ["Arena","Dungeon","Lost Tower","Devias","Noria","Atlans","Tarkan","Icarus","Aida","Valley of Loren","Crywolf Fortress","Kanturu"];
function farmOf(c) {
  const k = c.machine + "|" + c.name;
  if (!farmEdit[k]) farmEdit[k] = JSON.parse(JSON.stringify(c.farm || {mapas:["Arena"],retorno_min:60,alternativos:true,sondagem:true}));
  return farmEdit[k];
}
function farmMove(k, i, d) { const f = farmEdit[k]; const j = i + d; if (j < 0 || j >= f.mapas.length) return; [f.mapas[i], f.mapas[j]] = [f.mapas[j], f.mapas[i]]; renderDrawer(); }

// ---------------------------------------------------------------- Alertas

  const res = S.results || [], deaths = S.deaths || [], pks = S.pks || [];

  <h2>Mortes</h2><div class="feed">${deaths.map(d => `<div class="bad"><span class="t">${hhmm(d.ts)}</span><span><b>${esc(d.char)}</b> (${esc(d.machine)})${d.png ? ` · <a href="${d.png}" target="_blank">print</a>` : ""}</span></div>`).join("") || '<div class="note">nenhuma</div>'}</div>
  <h2>PK no servidor</h2><div class="feed">${pks.map(p => `<div><span class="t">${hhmm(p.ts)}</span><span>${esc(p.killer)} matou ${esc(p.victim)}</span></div>`).join("") || '<div class="note">nenhum</div>'}</div>`;
};

// ---------------------------------------------------------------- Computadores
VIEWS.pcs = () => {
  const ms = S.machines || [];
  let h = `<h1>Computadores</h1><div class="sub">Versão publicada: estável ${S.update ? S.update.seq : "—"}${S.update_test ? " · teste " + S.update_test.seq : ""}. Canal de teste: ${(S.test_machines || []).join(", ") || "nenhum"}.</div>
  <table><thead><tr><th>Computador</th><th>IP</th><th>Versão</th><th>Canal</th><th>Último relatório</th><th>CPU</th><th>RAM</th><th>Ligado há</th><th>Personagens</th><th>Automação</th></tr></thead><tbody>`;
  for (const m of ms) {
    const dr = m.death_return || {}, M = esc(m.name).replace(/'/g, "\\'");
    h += `<tr><td><i class="dot ${m.connected ? "ok" : ""}"></i> <b>${esc(m.name)}</b>${m.manual ? ' <span class="tag" style="background:#5a1d26;color:#ffb3bf" title="Pausa por F8 neste PC: automação pausada. Volta com F8 ou 3 min sem uso.">🔒 manual</span>' : ""}</td><td>${esc(m.ip || "—")}</td><td>${esc(m.version)}</td><td>${(S.test_machines || []).includes(m.name) ? '<span class="tag t">teste</span>' : "estável"}</td><td>${fmtDur(m.last_report_age_s)}</td><td class="num">${(m.cpu ?? 0).toFixed(1)}%</td><td class="num">${(m.mem_mb ?? 0).toFixed(0)} MB</td><td>${fmtDur(m.uptime_s)}</td><td>${(m.chars || []).map(c => esc(c.name)).join(", ") || "—"}</td>
      <td><button class="tg ${m.automation ? "on" : ""}" title="Pânico remoto: desliga toda a automação de teclado/mouse deste PC" onclick="cmd('${M}',{cmd:'set_config',automation_enabled:${!m.automation}},'automação ${m.automation ? "desligada" : "ligada"}')"></button></td></tr>
      <tr class="mrow"><td colspan="10"><div class="inl">
        <span class="note">Volta depois de morrer: até</span><input type="number" id="dr_n_${M}" min="1" max="20" value="${dr.max_returns ?? 3}"><span class="note">voltas em</span><input type="number" id="dr_w_${M}" min="1" max="240" value="${dr.window_min ?? 10}"><span class="note">min · espera de</span><input type="number" step="0.5" id="dr_a_${M}" min="0" max="30" value="${Math.round((dr.delay_min_s ?? 30) / 6) / 10}"><span class="note">a</span><input type="number" step="0.5" id="dr_b_${M}" min="0" max="30" value="${Math.round((dr.delay_max_s ?? 120) / 6) / 10}"><span class="note">min</span>
        <button class="sm" onclick="saveDR('${M}')">salvar regras</button>
        <span style="flex:1"></span>
        <button class="sm" onclick="cmd('${M}',{cmd:'pause_ram'},'pausar leitura da RAM')">pausar RAM</button>
        <button class="sm" onclick="cmd('${M}',{cmd:'resume_ram'},'retomar leitura da RAM')">retomar RAM</button>
        <button class="sm" onclick="cmd('${M}',{cmd:'send_logs'},'logs')">buscar logs</button>
        <button class="sm dang" onclick="if(confirm('Reiniciar o agente de ${M}?'))cmd('${M}',{cmd:'restart_agent'},'reiniciar agente')">reiniciar agente</button>
        <button class="sm dang" onclick="removePC('${M}')">remover PC</button></div></td></tr>`;
  }
  h += `</tbody></table>`;
  if (ms.some(m => m.last_error)) h += `<h2>Últimos erros</h2><div class="feed">${ms.filter(m => m.last_error).map(m => `<div class="bad"><span class="t">${esc(m.name)}</span><span>${esc(m.last_error)}</span></div>`).join("")}</div>`;
  return h;
};
function saveDR(m) {
  const v = id => +$(id + m).value;
  const c = { cmd: "set_death_return", max_returns: v("dr_n_"), window_min: v("dr_w_"), delay_min_s: Math.round(v("dr_a_") * 60), delay_max_s: Math.round(v("dr_b_") * 60) };
  if (!(c.max_returns >= 1 && c.max_returns <= 20 && c.window_min >= 1 && c.window_min <= 240 && c.delay_min_s <= c.delay_max_s && c.delay_max_s <= 1800)) { toast("Regras inválidas: voltas 1–20, janela 1–240 min, espera mínima ≤ máxima ≤ 30 min.", true); return; }
  cmd(m, c, "regras da volta");
}
async function removePC(m) {
  if (!confirm(`Remover ${m}? O token é apagado e o nome fica bloqueado (não volta pelo pareamento automático).`)) return;
  const token = ss("zm_admin"); if (!token) { toast("Cole o token de admin.", true); return; }
  const r = await fetch("/api/machine/remove", { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + token }, body: JSON.stringify({ machine: m }) });
  toast(r.ok ? m + " removido e bloqueado." : `Falhou (${r.status}): ` + await r.text(), !r.ok);
}

VIEWS.cfg = () => `<h1>Configurações</h1><div class="sub">Ajustes gerais.</div>
  <div class="sw" style="max-width:520px"><span>Cadastro automático de novos computadores (rede local)</span><button class="tg ${S.auto_pairing ? "on" : ""}" onclick="pairing(${!S.auto_pairing})"></button></div>
  <h2>Versão base (segurança)</h2><div class="note" style="max-width:640px">A versão que funcionava bem está congelada em <code>C:\\ZenMonitorNovo\\versoes\\base-v28-2026-11-10</code>. Para voltar a ela: rodar <code>restaurar-base.ps1</code> dessa pasta (como administrador). Ele confere os arquivos, recoloca os executáveis e publica o agente da base para todos os PCs.</div>`;
async function pairing(on) {
  const token = ss("zm_admin"); if (!token) { toast("Cole o token de admin.", true); return; }
  const r = await fetch("/api/auto_pairing", { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + token }, body: JSON.stringify({ enabled: on }) });
  toast(r.ok ? "salvo" : "falhou: " + r.status, !r.ok);
}

// ---------------------------------------------------------------- conexão (push do central)
let BOOT_ID = null;
function connect() {
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/panel");
  ws.onmessage = ev => {
    try { receiveState(JSON.parse(ev.data)); }
    catch (e) {
      const message = e instanceof Error ? e.message : String(e);
      if (lastRenderError !== message) toast("Erro ao exibir dados: " + message, true);
      lastRenderError = message;
      console.error("ZenMonitor: falha ao exibir atualização", e);
    }
  };
  // Central reiniciado (bot atualizado): esta mesma aba se recarrega, sem abrir outra.
  ws.onopen = async () => { try { const b = (await (await fetch("/api/panels")).json()).boot; if (BOOT_ID && b !== BOOT_ID) location.reload(); BOOT_ID = b; } catch {} };
  ws.onclose = () => setTimeout(connect, 2000);
}
setInterval(() => {
  const age = (Date.now() - lastMsgAt) / 1000;
  $("live").className = "dot " + (lastRenderError ? "bad" : age < 5 ? "ok" : age < 15 ? "warn" : "");
  $("livet").textContent = lastRenderError ? "erro ao exibir dados" : lastMsgAt ? (age < 5 ? ((S?.chars || []).length ? `ao vivo · ${S.chars.length} personagens` : "conectado · sem personagens") : `sem atualização há ${Math.round(age)} s`) : "conectando…";
}, 1000);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
tab = (location.hash || "#dash").slice(1); if (!TABS.some(t => t[0] === tab)) tab = "dash";
renderNav(); connect();
</script>
