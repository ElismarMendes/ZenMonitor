<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZenMonitor</title>
<style>
  :root {
    --bg: #05080d; --panel: #0a121c; --line: #13324a; --cyan: #2de2ff; --cyan-dim: #1a7f93;
    --text: #cfe9f2; --mute: #5f7f8f; --ok: #27e08a; --warn: #ffc23d; --bad: #ff4d6d; --vio: #b48cff;
    --cw: 260px; --fs: 1;
    --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.35 system-ui, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; overflow: hidden;
    background-image: radial-gradient(ellipse at top, #0b2233 0%, transparent 60%); }
  header { display: flex; gap: 18px; align-items: center; padding: 8px 14px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand { font: 700 16px var(--mono); letter-spacing: .18em; color: var(--cyan);
    text-shadow: 0 0 10px #2de2ff66; }
  .kpi { font-family: var(--mono); color: var(--mute); font-size: 12px; }
  .kpi b { color: var(--text); font-size: 15px; margin-left: 4px; }
  nav { margin-left: auto; display: flex; gap: 6px; }
  button, select, input { background: #0d1b28; color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 4px 9px; font: 12px var(--mono); cursor: pointer; }
  button:hover { border-color: var(--cyan); }
  button.on { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 8px #2de2ff44 inset; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); display: inline-block; }
  .dot.live { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  main { display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
  #view { overflow: hidden; padding: 10px; min-height: 0; }
  aside { border-left: 1px solid var(--line); padding: 10px; overflow: auto; min-height: 0; }
  h3 { margin: 4px 0 8px; font: 600 11px var(--mono); letter-spacing: .2em; color: var(--cyan-dim);
    text-transform: uppercase; }
  #chars-wrap { display: flex; flex-wrap: wrap; gap: 10px 18px; align-content: flex-start; }
  .machine { margin-bottom: 4px; }
  .machine > h4 { margin: 0 0 6px; font: 600 12px var(--mono); color: var(--mute); letter-spacing: .1em; }
  .grid { display: grid; gap: 8px; grid-template-columns: repeat(var(--cols, 4), var(--cw)); }
  .card { background: linear-gradient(180deg, #0c1824, var(--panel)); border: 1px solid var(--line);
    border-radius: 6px; padding: calc(8px * var(--fs)) calc(10px * var(--fs)); position: relative; }
  .card.s-ok { border-color: #1b5a3f; }
  .card.s-warn { border-color: var(--warn); box-shadow: 0 0 12px #ffc23d33; }
  .card.s-bad { border-color: var(--bad); box-shadow: 0 0 14px #ff4d6d44; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 2px #ff4d6d22; } }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .name { font-weight: 700; font-size: calc(14px * var(--fs)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lvl { color: var(--mute); font: calc(11px * var(--fs)) var(--mono); }
  .zen { font: 700 calc(22px * var(--fs)) var(--mono); color: var(--cyan); letter-spacing: .02em; }
  .zen.unknown { color: var(--mute); }
  .rate { font: calc(12px * var(--fs)) var(--mono); color: var(--ok); }
  .badge { font: 700 calc(10px * var(--fs)) var(--mono); padding: 1px 6px; border-radius: 3px;
    letter-spacing: .08em; }
  .b-ok { background: #0f3a28; color: var(--ok); }
  .b-warn { background: #3a2c08; color: var(--warn); }
  .b-bad { background: #3d0f19; color: var(--bad); }
  .b-mute { background: #16222c; color: var(--mute); }
  .bar { height: 5px; background: #0f2230; border-radius: 3px; margin: 6px 0 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan-dim), var(--cyan)); }
  .meta { display: flex; justify-content: space-between; font: calc(11px * var(--fs)) var(--mono); color: var(--mute); }
  .idle-ok { color: var(--ok); } .idle-warn { color: var(--warn); } .idle-bad { color: var(--bad); }
  canvas.spark { width: 100%; height: calc(28px * var(--fs)); display: block; margin-top: 4px; }
  .pk { font: 12px var(--mono); padding: 3px 0; border-bottom: 1px dashed #12283a; }
  .pk .t { color: var(--mute); margin-right: 6px; }
  .hp { color: #ff6b81; }
  .spots { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .spots canvas { border: 1px solid var(--line); border-radius: 6px; background: #000; image-rendering: pixelated; }
  .chip { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .death { display: grid; grid-template-columns: 96px 1fr; gap: 8px; align-items: center;
    font: 12px var(--mono); padding: 5px 0; border-bottom: 1px dashed #12283a; }
  .death img, .card img.shot { width: 96px; height: 74px; object-fit: cover; border: 1px solid var(--bad);
    border-radius: 3px; cursor: zoom-in; background: #000; display: block; }
  .card img.shot { width: 100%; height: auto; max-height: calc(90px * var(--fs)); margin-top: 5px; }
  #zoom { position: fixed; inset: 0; background: #000c; display: none; align-items: center; justify-content: center; z-index: 9; cursor: zoom-out; }
  #zoom img { max-width: 96vw; max-height: 92vh; border: 1px solid var(--bad); }
  .tag { font-size: 9px; padding: 0 4px; border-radius: 2px; background: #2a1d45; color: var(--vio); margin-left: 4px; }
  table { width: 100%; border-collapse: collapse; font: 12px var(--mono); }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--cyan-dim); font-weight: 600; }
  .err { color: var(--bad); }
  .scroll { overflow: auto; height: 100%; }
  pre { white-space: pre-wrap; max-height: 240px; overflow: auto; background: #071019; padding: 8px; font-size: 11px; }
  .note { color: var(--mute); font-size: 12px; }
  .empty { color: var(--mute); padding: 40px; text-align: center; font-family: var(--mono); }
  @media (max-width: 900px) {
    body { overflow: auto; }
    main { grid-template-columns: 1fr; }
    #view { overflow: visible; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    .grid { grid-template-columns: 1fr !important; }
    #chars-wrap { display: block; }
  }
</style>
</head>
<body>
<header>
  <span class="brand">ZEN//MONITOR</span>
  <span class="dot" id="live" title="conexão com o central"></span>
  <span class="kpi">ZEN TOTAL<b id="k-total">—</b></span>
  <span class="kpi">ZEN/H<b id="k-rate">—</b></span>
  <span class="kpi">CHARS<b id="k-chars">—</b></span>
  <span class="kpi">ALERTAS<b id="k-alerts">—</b></span>
  <nav>
    <button id="beep" title="bip em alerta novo">BIP: OFF</button>
    <button data-tab="chars" class="on">CHARS</button>
    <button data-tab="saude">SAÚDE</button>
    <button data-tab="spots">SPOTS</button>
    <button data-tab="maquinas">MÁQUINAS</button>
  </nav>
</header>
<main>
  <section id="view"></section>
  <aside>
    <h3>Mortes</h3>
    <div id="deaths"></div>
    <h3 style="margin-top:14px">Últimos PKs</h3>
    <div id="pks"></div>
    <h3 style="margin-top:14px">Ranking de players</h3>
    <div id="rank-tabs" style="display:flex;gap:4px;margin-bottom:6px">
      <button data-r="24h" class="on">24 H</button><button data-r="7d">7 D</button><button data-r="total">TOTAL</button>
    </div>
    <div id="rank"></div>
    <h3 style="margin-top:14px">Joias por dia</h3>
    <div class="note" id="jewels">Em calibração — só liga quando a contagem for provada exata.</div>
  </aside>
</main>
<div id="zoom" title="clique para fechar"><img alt=""></div>
<script>
"use strict";
// Regra: TODO texto vindo do jogo entra por textContent (nomes são hostis). Nada de innerHTML com dados.
const nf = new Intl.NumberFormat("pt-BR");
const LIMIT = 2e9;
const LABEL = { Offline: "SEM SINAL", Dc: "DC", Limit2B: "2 BI", Stopped: "PAROU", Dead: "MORTO", Near2B: "QUASE 2 BI" };
const SEVERITY = { Offline: "bad", Dc: "bad", Limit2B: "bad", Stopped: "bad", Dead: "bad", Near2B: "warn" };
let state = null, tab = "chars", rankKey = "24h", beepOn = false, seenAlerts = new Set();

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}
// Escolhas feitas em <select> sobrevivem ao redesenho (o painel atualiza a cada segundo).
const uiSel = {};
function keepSelect(sel, key) {
  if (key in uiSel && [...sel.options].some(o => o.value === uiSel[key])) sel.value = uiSel[key];
  sel.addEventListener("change", () => { uiSel[key] = sel.value; sel.blur(); });
  return sel;
}
// "3.0.0-alpha.1+7" -> mostra a publicação e avisa se está atrás da publicada no central.
function versionLabel(m) {
  const v = m.version || "—", pub = state.update && state.update.seq;
  const mm = /\+(\d+)$/.exec(v);
  if (!pub) return v;
  if (!mm) return v + " (sem atualização automática)";
  return +mm[1] >= pub ? v + " ✓" : v + ` (atualizando para ${pub}…)`;
}
function fmtRate(v) {
  if (!(v > 0)) return "+0/h";
  const [d, s, n] = v >= 1e9 ? [1e9, "B", 2] : v >= 1e6 ? [1e6, "M", 1] : v >= 1e3 ? [1e3, "k", 1] : [1, "", 0];
  return "+" + (v / d).toLocaleString("pt-BR", { maximumFractionDigits: n }) + s + "/h";
}
function fmtDur(s) {
  if (s == null) return "—";
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m" + String(s % 60).padStart(2, "0") + "s";
  return Math.floor(s / 3600) + "h" + String(Math.floor((s % 3600) / 60)).padStart(2, "0") + "m";
}
function fmtTime(ts) {
  return new Date(ts * 1000).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

function zoom(src) {
  const z = document.getElementById("zoom");
  z.querySelector("img").src = src;
  z.style.display = "flex";
}
function shot(src, cls) {
  const i = el("img", cls || ""); i.src = src; i.loading = "lazy"; i.alt = "print da morte";
  i.onclick = ev => { ev.stopPropagation(); zoom(src); };
  return i;
}
function lastDeathOf(c) {
  return (state.deaths || []).find(d => d.machine === c.machine && d.char === c.name) || null;
}

function badgeFor(c) {
  if (c.alerts.length) return [LABEL[c.alerts[0]] || c.alerts[0], SEVERITY[c.alerts[0]] || "bad"];
  if (c.zen == null) return ["SEM ZEN", "mute"];
  return ["CATANDO", "ok"];
}

function drawSpark(cv, pts) {
  const r = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  cv.width = w * r; cv.height = h * r;
  const g = cv.getContext("2d");
  g.scale(r, r);
  if (pts.length < 2) return;
  const t0 = pts[0][0], t1 = pts[pts.length - 1][0];
  let lo = Infinity, hi = -Infinity;
  for (const [, z] of pts) { lo = Math.min(lo, z); hi = Math.max(hi, z); }
  if (hi === lo) hi = lo + 1;
  g.strokeStyle = "#2de2ff"; g.lineWidth = 1.4; g.beginPath();
  pts.forEach(([t, z], i) => {
    const x = ((t - t0) / Math.max(1, t1 - t0)) * w, y = h - 2 - ((z - lo) / (hi - lo)) * (h - 4);
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  });
  g.stroke();
}

function card(c) {
  const [blabel, sev] = badgeFor(c);
  const d = el("div", "card s-" + (sev === "ok" ? "ok" : sev === "mute" ? "" : sev));
  const r1 = el("div", "row");
  r1.append(el("span", "name", c.name), el("span", "badge b-" + sev, blabel));
  const lv = el("div", "lvl", `LV ${c.level ?? "—"} · RR ${c.resets ?? "—"}` + (String(c.zen_source).toLowerCase() === "ocr" ? " · OCR" : ""));
  if (c.hp != null) lv.append(el("span", "hp", " · HP " + nf.format(c.hp)));
  const r2 = el("div", "row");
  r2.append(el("span", "zen" + (c.zen == null ? " unknown" : ""), c.zen == null ? "—" : nf.format(c.zen)),
            el("span", "rate", fmtRate(c.zen_per_hour)));
  const bar = el("div", "bar"), fill = el("i");
  fill.style.width = c.zen == null ? "0" : Math.min(100, (c.zen / LIMIT) * 100).toFixed(1) + "%";
  bar.append(fill);
  const meta = el("div", "meta");
  const idle = c.idle_secs ?? null;
  const ic = idle == null ? "" : idle < 60 ? "idle-ok" : idle < 180 ? "idle-warn" : "idle-bad";
  meta.append(el("span", ic, "parado " + fmtDur(idle)),
              el("span", "", c.zen != null && c.zen >= 1999000000 ? "NO LIMITE" : c.eta_limit_s == null ? "2 bi: —" : "2 bi em " + fmtDur(c.eta_limit_s)));
  const cv = el("canvas", "spark");
  d.append(r1, lv, r2, bar, meta, cv);
  if (c.auto_status) d.append(el("div", "lvl", c.auto_status));
  if (c.return_on_death != null || c.auto_deposit != null || c.automation != null) {
    const row = el("div"); row.style.display = "flex"; row.style.gap = "6px"; row.style.flexWrap = "wrap";
    if (c.automation != null) row.append(charAutoToggle(c));
    if (c.return_on_death != null) row.append(returnToggle(c));
    if (c.auto_deposit != null) row.append(depositToggle(c));
    d.append(row);
  }
  // Morreu nos últimos 10 min (alerta MORTO ativo): o print da morte aparece no card.
  if (c.alerts.includes("Dead")) {
    const dd = lastDeathOf(c);
    if (dd && dd.png) d.append(shot(dd.png, "shot"));
  }
  requestAnimationFrame(() => drawSpark(cv, c.spark || []));
  return d;
}

function renderChars(view) {
  if (!state.chars.length) {
    view.append(el("div", "empty", "Nenhum char ainda. Ligue um agente apontando para este central."));
    return;
  }
  const byMachine = new Map();
  for (const c of state.chars) {
    if (!byMachine.has(c.machine)) byMachine.set(c.machine, []);
    byMachine.get(c.machine).push(c);
  }
  const wrap = el("div"); wrap.id = "chars-wrap";
  view.append(wrap);
  for (const [m, list] of byMachine) {
    const box = el("div", "machine");
    box.append(el("h4", "", m + ` · ${list.length} char(s)`));
    const g = el("div", "grid");
    g.style.setProperty("--cols", Math.min(list.length, 4));
    list.forEach(c => g.append(card(c)));
    box.append(g);
    wrap.append(box);
  }
  fitDensity(view);
}

// Tudo cabe sem rolar (ex.: 3440x1440): começa grande e encolhe até caber
// na altura E na largura. Máquinas ficam lado a lado quando sobra largura.
function fitDensity(view) {
  if (window.innerWidth <= 900) return;
  const root = document.documentElement.style;
  const fits = () => view.scrollHeight <= view.clientHeight + 1 && view.scrollWidth <= view.clientWidth + 1;
  for (let step = 0; step <= 40; step++) {
    const cw = Math.max(170, 460 - step * 8), fs = Math.max(0.72, 1.6 - step * 0.025);
    root.setProperty("--cw", cw + "px"); root.setProperty("--fs", fs);
    if (fits()) return;
  }
}

function renderHealth(view) {
  const wrap = el("div", "scroll"), t = el("table");
  const head = el("tr");
  ["Máquina", "IP", "Versão", "Canal", "Conectado", "Último relatório", "CPU", "Mem", "Ligado há", "RAM", "Chars / trava", "Último erro"]
    .forEach(h => head.append(el("th", "", h)));
  t.append(head);
  for (const m of state.machines) {
    const tr = el("tr");
    const chars = m.chars.map(c => `${c.name}: ${c.lock}${c.hp_lock ? " · " + c.hp_lock : ""}${c.auto ? " · " + c.auto : ""}${c.tcp ? "" : " (sem TCP)"}`).join("\n");
    [m.name, m.ip ?? "—", versionLabel(m), m.channel || "—", m.connected ? "sim" : "NÃO",
     m.last_report_age_s == null ? "—" : fmtDur(m.last_report_age_s) + " atrás",
     (m.cpu ?? 0).toFixed(1) + "%", (m.mem_mb ?? 0).toFixed(0) + " MB", fmtDur(m.uptime_s),
     (m.ram_paused ? "PAUSADA" : "lendo") + (m.automation ? " · AUTOMAÇÃO" : ""), chars].forEach(v => {
      const td = el("td", "", v); td.style.whiteSpace = "pre-line"; tr.append(td);
    });
    tr.append(el("td", m.last_error ? "err" : "", m.last_error || "—"));
    t.append(tr);
  }
  wrap.append(t);
  view.append(wrap);
}

async function sendCommand(machine, command) {
  const token = sessionStorageGet("zm_admin");
  if (!token) { alertBox("Cole o token de admin (central.toml) no campo acima."); return; }
  try {
    const r = await fetch("/api/command", {
      method: "POST",
      headers: { "content-type": "application/json", authorization: "Bearer " + token },
      body: JSON.stringify({ machine, command }),
    });
    if (!r.ok) alertBox(`Falhou (${r.status}): ` + await r.text());
  } catch (e) { alertBox("Erro de rede: " + e); }
}
async function removeMachine(machine) {
  const token = sessionStorageGet("zm_admin");
  if (!token) { alertBox("Cole o token de admin (central.toml) no campo acima."); return; }
  try {
    const r = await fetch("/api/machine/remove", {
      method: "POST",
      headers: { "content-type": "application/json", authorization: "Bearer " + token },
      body: JSON.stringify({ machine }),
    });
    alertBox(r.ok ? machine + " removido e bloqueado." : `Falhou (${r.status}): ` + await r.text());
  } catch (e) { alertBox("Erro de rede: " + e); }
}

async function setAutoPairing(enabled) {
  const token = sessionStorageGet("zm_admin");
  if (!token) { alertBox("Cole o token de admin (central.toml) no campo acima."); return; }
  try {
    const r = await fetch("/api/auto_pairing", {
      method: "POST",
      headers: { "content-type": "application/json", authorization: "Bearer " + token },
      body: JSON.stringify({ enabled }),
    });
    if (!r.ok) { alertBox(`Falhou (${r.status}): ` + await r.text()); return; }
    state.auto_pairing = enabled; lastNotice = ""; render();
  } catch (e) { alertBox("Erro de rede: " + e); }
}
function sessionStorageGet(k) { try { return sessionStorage.getItem(k) || ""; } catch { return ""; } }
function sessionStorageSet(k, v) { try { sessionStorage.setItem(k, v); } catch {} }
let lastNotice = "";
function alertBox(msg) { lastNotice = msg; render(); }

function renderMachines(view) {
  const wrap = el("div", "scroll");
  const top = el("div", "row");
  top.style.justifyContent = "flex-start";
  const inp = el("input"); inp.type = "password"; inp.placeholder = "token de admin"; inp.value = sessionStorageGet("zm_admin");
  inp.onchange = () => sessionStorageSet("zm_admin", inp.value.trim());
  top.append(el("span", "note", "Comandos (lista fechada, ficam na auditoria): "), inp);
  wrap.append(top);
  // Interruptor da automação de token (pareamento automático + renovação).
  const tok = el("div", "row");
  tok.style.justifyContent = "flex-start"; tok.style.margin = "10px 0";
  const on = !!state.auto_pairing;
  const tb = el("button", on ? "on" : "", on ? "AUTOMAÇÃO DE TOKEN: LIGADA" : "AUTOMAÇÃO DE TOKEN: DESLIGADA");
  tb.onclick = () => setAutoPairing(!on);
  tok.append(tb, el("span", "note", on
    ? " PCs novos da rede local se cadastram sozinhos; tokens renovados a cada 30 dias."
    : " Modo manual: só entram PCs com token escrito no central.toml."));
  wrap.append(tok);
  if (lastNotice) wrap.append(el("p", "err", lastNotice));
  const t = el("table");
  for (const m of state.machines) {
    const tr = el("tr");
    tr.append(el("td", "", m.name + (m.connected ? "" : " (desconectado)")));
    const td = el("td");
    const btn = (label, cmd) => { const b = el("button", "", label); b.onclick = () => sendCommand(m.name, cmd); return b; };
    td.append(btn("Pausar RAM", { cmd: "pause_ram" }), btn("Retomar RAM", { cmd: "resume_ram" }),
              btn("Enviar logs", { cmd: "send_logs" }), btn("Reiniciar agente", { cmd: "restart_agent" }));
    // Interruptor da automação de teclado/mouse deste PC (pânico remoto).
    const auto = el("button", m.automation ? "on" : "", m.automation ? "AUTOMAÇÃO: LIGADA" : "AUTOMAÇÃO: DESLIGADA");
    auto.onclick = () => sendCommand(m.name, { cmd: "set_config", automation_enabled: !m.automation });
    td.append(" ", auto);
    const rm = el("button", "", "Remover PC");
    rm.style.borderColor = "var(--bad)";
    rm.onclick = () => {
      if (confirm("Remover " + m.name + "? O token é apagado e o nome fica bloqueado (não volta pelo pareamento automático).\n\nDesfazer: tirar o nome de blocked_machines no central.toml, com o central parado.")) removeMachine(m.name);
    };
    td.append(" ", rm);
    if (m.death_return) td.append(deathReturnForm(m));
    if (m.chars.length) {
      const sel = el("select");
      m.chars.forEach(c => { const o = el("option", "", c.name); o.value = c.name; sel.append(o); });
      keepSelect(sel, "maq:" + m.name);
      const b1 = el("button", "", "Refazer trava");
      b1.onclick = () => sendCommand(m.name, { cmd: "relock_ram", char_name: sel.value });

      const b8 = el("button", "", "Fortuna: K → J aqui");

  wrap.append(t);
  wrap.append(el("h3", "", "Resultados"));
  for (const r of state.results || []) {

}

  const n = num(d.max_returns, "4em", 1, 20), win = num(d.window_min, "4em", 1, 240);
  const a = num(Math.round(d.delay_min_s / 6) / 10, "4.5em", 0, 30), b = num(Math.round(d.delay_max_s / 6) / 10, "4.5em", 0, 30);
  a.step = b.step = "0.5";

    const cmd = { cmd: "set_death_return", max_returns: +n.value, window_min: +win.value,
                  delay_min_s: Math.round(+a.value * 60), delay_max_s: Math.round(+b.value * 60) };
    if (!(cmd.max_returns >= 1 && cmd.max_returns <= 20 && cmd.window_min >= 1 && cmd.window_min <= 240 &&

// ---------------------------------------------------------------- SPOTS (mini-mapa do Kanturu 1)
// O mapa e a lista NÃO são recriados a cada atualização (era isso que fazia o clique em
// "Usar este spot" sumir e o scroll voltar ao topo): o canvas é redesenhado no lugar e as
// tabelas só são refeitas quando os dados mudam e você não está mexendo nelas.
const CHAR_COLORS = ["#ff5c8a", "#ffd23f", "#3ee8ff", "#a77bff", "#59f08a", "#ff9f43", "#ffffff"];
let terrainImg = null, terrainLoading = false, terrainCodes = null, terrainW = 256, terrainBox = [0, 0, 256, 256];
function loadTerrain() {
  if (terrainImg || terrainLoading) return;
  terrainLoading = true;
  fetch("/api/terrain/kanturu").then(r => r.json()).then(t => {
    const bin = atob(t.codes), c = document.createElement("canvas");
    c.width = t.w; c.height = t.h;
    const g = c.getContext("2d"), img = g.createImageData(t.w, t.h);
    let x0 = t.w, y0 = t.h, x1 = 0, y1 = 0;
    for (let i = 0; i < bin.length; i++) {
      const v = bin.charCodeAt(i), col = v === 1 ? [22, 27, 34] : v === 2 ? [45, 79, 143] : [46, 93, 58];
      img.data[i * 4] = col[0]; img.data[i * 4 + 1] = col[1]; img.data[i * 4 + 2] = col[2]; img.data[i * 4 + 3] = 255;
      if (v !== 1) { const x = i % t.w, y = (i / t.w) | 0; x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    }
    g.putImageData(img, 0, 0);
    // Só a parte do mapa onde se anda (+ margem): o resto do 256x256 é vazio.
    const m = 6;
    if (x1 >= x0) terrainBox = [Math.max(0, x0 - m), Math.max(0, y0 - m), Math.min(t.w, x1 + m + 1), Math.min(t.h, y1 + m + 1)];
    terrainImg = c; terrainCodes = bin; terrainW = t.w;
    if (spotsUI) spotsUI.sized = false;
    if (tab === "spots") render();
  }).catch(() => { terrainLoading = false; });
}
function tileKind(x, y) {
  if (!terrainCodes || x < 0 || y < 0 || x >= terrainW || y >= terrainW) return "?";
  const v = terrainCodes.charCodeAt(y * terrainW + x);
  return v === 1 ? "bloqueado" : v === 2 ? "zona segura" : "andável";
}

let spotsUI = null, spotsHold = 0, pickTile = null, hoverTile = null;
function spotColors() { const m = {}; (state.chars || []).forEach((c, i) => m[c.machine + "/" + c.name] = CHAR_COLORS[i % CHAR_COLORS.length]); return m; }

function buildSpotsUI() {
  const root = el("div", "scroll"), box = el("div", "spots"), left = el("div"), cv = el("canvas"), info = el("div", "note");
  cv.style.cursor = "crosshair"; cv.style.maxWidth = "100%";
  left.append(cv, info);
  const side = el("div");
  box.append(left, side); root.append(box);
  const ui = { root, cv, info, side, sig: "", sized: false, S: 3 };
  const tileAt = ev => {
    const r = cv.getBoundingClientRect(), [bx, by] = terrainBox;
    const x = bx + Math.floor((ev.clientX - r.left) * (cv.width / r.width) / ui.S);
    const y = by + Math.floor((ev.clientY - r.top) * (cv.height / r.height) / ui.S);
    return [x, y];
  };
  cv.addEventListener("mousemove", ev => { hoverTile = tileAt(ev); drawSpotsMap(); });
  cv.addEventListener("mouseleave", () => { hoverTile = null; drawSpotsMap(); });
  cv.addEventListener("click", ev => { pickTile = tileAt(ev); spotsHold = 0; ui.sig = ""; renderSpotsSide(true); drawSpotsMap(); });
  // Mexendo na lista (abrir select, clicar botão): não refaz as tabelas por 5 s.
  side.addEventListener("pointerdown", () => { spotsHold = Date.now() + 5000; }, true);
  side.addEventListener("change", () => { spotsHold = Date.now() + 5000; }, true);
  return ui;
}

function drawSpotsMap() {
  const ui = spotsUI; if (!ui) return;
  const [bx, by, ex, ey] = terrainBox, bw = ex - bx, bh = ey - by;
  if (!ui.sized) {
    ui.S = Math.max(2, Math.floor(720 / Math.max(bw, bh)));
    ui.cv.width = bw * ui.S; ui.cv.height = bh * ui.S; ui.sized = !!terrainImg;
  }
  const S = ui.S, g = ui.cv.getContext("2d");
  const X = x => (x - bx + 0.5) * S, Y = y => (y - by + 0.5) * S;
  g.clearRect(0, 0, ui.cv.width, ui.cv.height);
  if (terrainImg) { g.imageSmoothingEnabled = false; g.drawImage(terrainImg, bx, by, bw, bh, 0, 0, bw * S, bh * S); }
  else { g.fillStyle = "#5f7f8f"; g.font = "14px monospace"; g.fillText("carregando o mapa...", 20, 30); return; }
  const cat = state.catalog || [], colorOf = spotColors(), chars = state.chars || [];
  g.setLineDash([4, 4]); g.lineWidth = 1.5;
  for (const c of chars) {
    if (!c.pos || !c.spot) continue;
    g.strokeStyle = colorOf[c.machine + "/" + c.name];
    g.beginPath(); g.moveTo(X(c.pos[0]), Y(c.pos[1])); g.lineTo(X(c.spot[0]), Y(c.spot[1])); g.stroke();
  }
  g.setLineDash([]);
  for (const sp of cat) {
    g.fillStyle = "#0a121c"; g.strokeStyle = "#e9f7ff"; g.lineWidth = 2;
    g.beginPath(); g.arc(X(sp.x), Y(sp.y), 9, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = "#e9f7ff"; g.font = "bold 11px monospace"; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(String(sp.n), X(sp.x), Y(sp.y) + 0.5);
    // Nome do dono ao lado do spot.
    const ow = spotOwner(sp, chars);
    if (ow) {
      g.font = "bold 12px sans-serif"; g.textAlign = "left"; g.textBaseline = "top"; g.lineWidth = 3; g.strokeStyle = "#000";
      g.fillStyle = colorOf[ow.machine + "/" + ow.name] || "#e9f7ff";
      g.strokeText(ow.name, X(sp.x) + 11, Y(sp.y) + 4); g.fillText(ow.name, X(sp.x) + 11, Y(sp.y) + 4);
    }
  }
  for (const c of chars) {
    if (!c.pos) continue;
    g.fillStyle = colorOf[c.machine + "/" + c.name]; g.strokeStyle = "#000"; g.lineWidth = 1.5;
    g.beginPath(); g.arc(X(c.pos[0]), Y(c.pos[1]), 6, 0, Math.PI * 2); g.fill(); g.stroke();
    g.font = "12px sans-serif"; g.textAlign = "left"; g.textBaseline = "bottom"; g.lineWidth = 3;
    g.strokeText(c.name, X(c.pos[0]) + 8, Y(c.pos[1]) - 4); g.fillText(c.name, X(c.pos[0]) + 8, Y(c.pos[1]) - 4);
  }
  for (const [t, col] of [[pickTile, "#ffd23f"], [hoverTile, "#ffffff"]]) {
    if (!t) continue;
    g.strokeStyle = col; g.lineWidth = 2; g.strokeRect((t[0] - bx) * S, (t[1] - by) * S, S, S);
    g.beginPath(); g.arc(X(t[0]), Y(t[1]), S * 2.5, 0, Math.PI * 2); g.stroke();
  }
  const h = hoverTile ? `cursor: (${hoverTile[0]}, ${hoverTile[1]}) ${tileKind(...hoverTile)}` : "passe o mouse no mapa; clique para escolher um tile";
  ui.info.textContent = h + "   ·   verde = andável, azul = zona segura, escuro = bloqueado";
}

const cheb = (a, b) => Math.max(Math.abs(a[0] - b[0]), Math.abs(a[1] - b[1]));
// Dono de um spot do catálogo: o char (do mesmo PC) que volta para ele. Um spot, um dono.
function spotOwner(sp, chars) { return chars.find(c => c.machine === sp.machine && c.spot && c.spot[0] === sp.x && c.spot[1] === sp.y); }

function lockToggle(c) {
  const on = c.spot_locked === true;
  const b = el("button", "", on ? "🔒 Travado" : "🔓 Livre");
  b.title = on ? "o spot deste char não muda (painel nem F1) e não pode ser excluído. Clique para destravar"
               : "clique para travar o char no spot atual";
  b.style.borderColor = on ? "var(--warn)" : "";
  b.onpointerdown = ev => { ev.preventDefault(); ev.stopPropagation(); sendCommand(c.machine, { cmd: "set_spot_lock", char_name: c.name, locked: !on }); };
  return b;
}

function renderSpotsSide(force) {
  const ui = spotsUI, cat = state.catalog || [], chars = state.chars || [];
  const sig = JSON.stringify([cat, chars.map(c => [c.machine, c.name, c.spot, c.pos, c.return_on_death, c.auto_deposit, c.spot_locked, c.automation]), lastNotice, pickTile]);
  if (!force) {
    if (sig === ui.sig) return;
    if (Date.now() < spotsHold) return;
    if (ui.side.contains(document.activeElement) && document.activeElement !== document.body) return;
  }
  ui.sig = sig;
  const colorOf = spotColors(), side = ui.side;
  side.replaceChildren();
  if (lastNotice) side.append(el("p", "err", lastNotice));

  if (pickTile) {
    const [x, y] = pickTile, kind = tileKind(x, y);
    const near = cat.find(sp => cheb([sp.x, sp.y], [x, y]) <= 2);
    const owner = near && spotOwner(near, chars);
    side.append(el("h3", "", `Tile escolhido: (${x}, ${y})`));
    side.append(el("p", kind === "andável" ? "note" : "err",
      kind + (near ? ` · vira o spot ${near.n} (${near.x}, ${near.y})` + (owner ? `, que é do ${owner.name}` : ", livre") : " · entra no catálogo como spot novo")));
    if (kind === "andável") {
      const sel = el("select");
      chars.forEach(c => {
        const o = el("option", "", `${c.name} (${c.machine})` + (c.spot_locked ? " 🔒" : ""));
        o.value = c.machine + "\n" + c.name;
        o.disabled = c.spot_locked === true || (owner && owner !== c && owner.machine === c.machine);
        sel.append(o);
      });
      keepSelect(sel, "pick");
      const go = el("button", "", "Este char volta para cá");
      go.onclick = () => {
        const [m, n] = sel.value.split("\n"); if (!n) return;
        if (owner && !(owner.machine === m && owner.name === n)) { alertBox(`O spot ${near.n} já é do ${owner.name}. Troque o ${owner.name} de spot antes.`); return; }
        sendCommand(m, { cmd: "assign_spot", char_name: n, x, y });
      };
      const clr = el("button", "", "Limpar");
      clr.onclick = () => { pickTile = null; renderSpotsSide(true); drawSpotsMap(); };
      side.append(sel, go, clr);
    }
  }

  // ---- catálogo: um spot, um dono
  side.append(el("h3", "", "Spots do catálogo"));
  side.append(el("p", "note", "Ordem de busca. Um spot tem no máximo um dono. F2 no jogo cataloga o tile; F1 fixa o char nele; ou clique no mapa."));
  const t = el("table"), head = el("tr");
  ["#", "Tile", "Dono", "Situação", ""].forEach(h => head.append(el("th", "", h)));
  t.append(head);
  if (!cat.length) { const tr = el("tr"); const td = el("td", "note", "Nenhum spot ainda. Use F2 no jogo."); td.colSpan = 5; tr.append(td); t.append(tr); }
  for (const sp of cat) {
    const tr = el("tr"), owner = spotOwner(sp, chars);
    const tdO = el("td");
    if (owner) {
      const chip = el("span", "chip"); chip.style.background = colorOf[owner.machine + "/" + owner.name];
      tdO.append(chip, el("span", "", owner.name + (owner.spot_locked ? " 🔒" : "")));
    } else tdO.append(el("span", "note", "—"));
    let sit, cls = "";
    if (!owner) { sit = "livre"; cls = "idle-ok"; }
    else if (owner.pos && cheb(owner.pos, [sp.x, sp.y]) <= 10) { sit = "farmando ali"; cls = "idle-ok"; }
    else { sit = owner.pos ? `dono longe (${owner.pos[0]}, ${owner.pos[1]})` : "dono fora do Kanturu"; cls = "idle-warn"; }
    const del = el("button", "", "Excluir");
    del.disabled = owner && owner.spot_locked === true;
    del.title = del.disabled ? "destrave o dono antes" : "tira o spot do catálogo" + (owner ? ` (o ${owner.name} fica sem spot)` : "");
    del.onclick = () => { if (confirm(`Excluir o spot ${sp.n} (${sp.x}, ${sp.y})?` + (owner ? `\n${owner.name} fica sem spot e não volta sozinho.` : ""))) sendCommand(sp.machine, { cmd: "delete_spot", x: sp.x, y: sp.y }); };
    const tdDel = el("td"); tdDel.append(del);
    tr.append(el("td", "", sp.n), el("td", "", `(${sp.x}, ${sp.y})`), tdO, el("td", cls, sit), tdDel);
    t.append(tr);
  }
  side.append(t);

  // ---- chars
  side.append(el("h3", "", "Chars"));
  const t2 = el("table"), h2 = el("tr");
  ["", "Char", "Onde está", "Automação", "Spot", "Trava", "Depois de morrer", "Baú"].forEach(h => h2.append(el("th", "", h)));
  t2.append(h2);
  for (const c of chars) {
    const tr = el("tr");
    const chip = el("span", "chip"); chip.style.background = colorOf[c.machine + "/" + c.name];
    const tdc = el("td"); tdc.append(chip);
    const sel = el("select");
    const none = el("option", "", "— sem spot —"); none.value = ""; sel.append(none);
    for (const sp of cat.filter(sp => sp.machine === c.machine)) {
      const owner = spotOwner(sp, chars), mine = owner === c;
      const o = el("option", "", `${sp.n}: (${sp.x}, ${sp.y})` + (owner && !mine ? ` — do ${owner.name}` : ""));
      o.value = sp.x + "," + sp.y;
      o.disabled = !!owner && !mine;
      if (mine) o.selected = true;
      sel.append(o);
    }
    keepSelect(sel, "spot:" + c.machine + "/" + c.name);
    const go = el("button", "", "Usar");
    sel.disabled = go.disabled = c.spot_locked === true;
    if (c.spot_locked) sel.title = go.title = "char travado no spot: destrave para trocar";
    go.onclick = () => {
      if (!sel.value) return;
      const [x, y] = sel.value.split(",").map(Number);
      if (c.spot && c.spot[0] === x && c.spot[1] === y) return;
      delete uiSel["spot:" + c.machine + "/" + c.name];
      sendCommand(c.machine, { cmd: "assign_spot", char_name: c.name, x, y });
    };
    const tds = el("td"); tds.append(sel, go);
    const tdl = el("td"); if (c.spot_locked != null) tdl.append(lockToggle(c));
    const tdr = el("td"); if (c.return_on_death != null) tdr.append(returnToggle(c));
    const tdb = el("td"); if (c.auto_deposit != null) tdb.append(depositToggle(c));
    const tda = el("td"); if (c.automation != null) tda.append(charAutoToggle(c));
    if (c.automation === false) tr.style.opacity = "0.6";
    tr.append(tdc, el("td", "", c.name), el("td", "", c.pos ? `(${c.pos[0]}, ${c.pos[1]})` : "fora do Kanturu / ?"), tda, tds, tdl, tdr, tdb);
    t2.append(tr);
  }
  side.append(t2);
  const inp = el("input"); inp.type = "password"; inp.placeholder = "token de admin (para trocar/excluir)"; inp.value = sessionStorageGet("zm_admin");
  inp.onchange = () => sessionStorageSet("zm_admin", inp.value.trim());
  side.append(el("p", "note", ""), inp);
}

function renderSpots(view) {
  loadTerrain();
  if (!spotsUI) spotsUI = buildSpotsUI();
  view.append(spotsUI.root);
  drawSpotsMap();
  renderSpotsSide(false);
}

function renderSide() {
  const deaths = document.getElementById("deaths");
  deaths.replaceChildren();
  const dl = state.deaths || [];
  if (!dl.length) deaths.append(el("div", "note", "Nenhuma morte registrada."));
  for (const d of dl.slice(0, 8)) {
    const row = el("div", "death");
    row.append(d.png ? shot(d.png) : el("div", "note", "sem print"));
    const info = el("div");
    const day = new Date(d.ts * 1000).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
    info.append(el("div", "", d.char), el("div", "t note", `${day} ${fmtTime(d.ts)} · ${d.machine}`),
                el("div", "hp", "HP antes: " + nf.format(d.hp_before) + (d.screen_hp == null ? " · tela ilegível" : "")));
    row.append(info);
    deaths.append(row);
  }
  const pks = document.getElementById("pks");
  pks.replaceChildren();
  if (!state.pks.length) pks.append(el("div", "note", "Nenhum PK registrado (leitura do chat desligada por padrão)."));
  for (const p of state.pks.slice(0, 15)) {
    const d = el("div", "pk");
    d.append(el("span", "t", fmtTime(p.ts)), el("span", "", p.killer));
    if (p.monster) d.append(el("span", "tag", "MONSTRO"));
    d.append(el("span", "", " → " + p.victim));
    pks.append(d);
  }
  const rank = document.getElementById("rank");
  rank.replaceChildren();
  const list = (state.ranking || {})[rankKey] || [];
  if (!list.length) rank.append(el("div", "note", "—"));
  list.forEach(([name, n], i) => {
    const d = el("div", "pk");
    d.append(el("span", "t", String(i + 1).padStart(2, "0")), el("span", "", name), el("b", "", "  " + n));
    rank.append(d);
  });
}

function renderHeader() {
  let total = 0, rate = 0, alerts = 0;
  for (const c of state.chars) { total += c.zen || 0; rate += c.zen_per_hour || 0; alerts += c.alerts.length ? 1 : 0; }
  document.getElementById("k-total").textContent = nf.format(total);
  document.getElementById("k-rate").textContent = fmtRate(rate);
  document.getElementById("k-chars").textContent = state.chars.length;
  const ka = document.getElementById("k-alerts");
  ka.textContent = alerts; ka.style.color = alerts ? "var(--bad)" : "var(--ok)";
}

function checkBeep() {
  const now = new Set();
  for (const c of state.chars) for (const a of c.alerts) if (SEVERITY[a] === "bad") now.add(c.machine + "/" + c.name + "/" + a);
  const fresh = [...now].some(k => !seenAlerts.has(k));
  seenAlerts = now;
  if (fresh && beepOn) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)(), o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; g.gain.value = 0.08; o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.25);
    } catch {}
  }
}

function render() {
  if (!state) return;
  renderHeader();
  renderSide();
  const view = document.getElementById("view");
  const keepScroll = view.scrollTop, keepInner = spotsUI ? spotsUI.root.scrollTop : 0;
  view.replaceChildren();
  view.style.overflow = tab === "chars" ? "hidden" : "auto";
  if (tab === "chars") renderChars(view);
  else if (tab === "saude") renderHealth(view);
  else if (tab === "spots") renderSpots(view);
  else renderMachines(view);
  view.scrollTop = keepScroll;
  if (tab === "spots" && spotsUI) spotsUI.root.scrollTop = keepInner;
}

// O painel é redesenhado a cada atualização. Redesenhar no meio de um clique troca o botão
// por outro (o clique some) e fecha listas abertas. Regra: depois de qualquer toque/tecla,
// espera 2,5 s; com um campo ou lista em foco, espera sair dele.
let lastRender = 0, pending = false, holdUntil = 0;
for (const ev of ["pointerdown", "keydown", "wheel", "touchstart"]) {
  document.addEventListener(ev, e => { if (!(e.target.closest && e.target.closest("nav"))) holdUntil = Date.now() + 2500; }, true);
}
function busyUI() {
  const a = document.activeElement;
  if (a && ["INPUT", "SELECT", "TEXTAREA"].includes(a.tagName)) return true;
  return Date.now() < holdUntil;
}
function requestRender() {
  if (pending) return;
  const wait = busyUI() ? 400 : Math.max(0, 900 - (Date.now() - lastRender));
  if (wait === 0) { lastRender = Date.now(); render(); return; }
  pending = true;
  setTimeout(() => { pending = false; requestRender(); }, wait);
}
function onState(s) {
  state = s;
  checkBeep();
  requestRender();
}

function connect() {
  const live = document.getElementById("live");
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/panel");
  ws.onopen = () => live.classList.add("live");
  ws.onmessage = ev => { try { onState(JSON.parse(ev.data)); } catch (e) { console.error(e); } };
  ws.onclose = () => { live.classList.remove("live"); setTimeout(connect, 2000); };
}

document.querySelectorAll("nav [data-tab]").forEach(b => b.onclick = () => {
  tab = b.dataset.tab; lastNotice = "";
  document.querySelectorAll("nav [data-tab]").forEach(x => x.classList.toggle("on", x === b));
  render();
});
document.querySelectorAll("#rank-tabs [data-r]").forEach(b => b.onclick = () => {
  rankKey = b.dataset.r;
  document.querySelectorAll("#rank-tabs [data-r]").forEach(x => x.classList.toggle("on", x === b));
  renderSide();
});
document.getElementById("zoom").onclick = e => { e.currentTarget.style.display = "none"; };
document.getElementById("beep").onclick = e => { beepOn = !beepOn; e.target.textContent = "BIP: " + (beepOn ? "ON" : "OFF"); e.target.classList.toggle("on", beepOn); };
window.addEventListener("resize", () => requestRender());
connect();
</script>
